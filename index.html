<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f4;
        color: #222;
        line-height: 1.6;
    }

    /* Cabeçalho */
    header {
        background: linear-gradient(135deg, #009c3b, #006b28);
        color: white;
        padding: 20px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    header h1 {
        font-size: 28px;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 25px;
    }

    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    nav a:hover {
        color: #ffdf00;
    }

    /* Banner */
    .hero {
        min-height: 500px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        color: white;
        padding: 40px 20px;
        background:
            linear-gradient(rgba(0, 70, 30, 0.75), rgba(0, 40, 20, 0.8)),
            url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1600&q=80")
            center/cover;
    }

    .hero-content {
        max-width: 800px;
    }

    .hero h2 {
        font-size: 55px;
        margin-bottom: 15px;
        text-transform: uppercase;
    }

    .hero p {
        font-size: 20px;
        margin-bottom: 30px;
    }

    .btn {
        display: inline-block;
        background-color: #ffdf00;
        color: #006b28;
        padding: 12px 25px;
        border-radius: 25px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background-color: white;
        transform: scale(1.05);
    }

    /* Conteúdo geral */
    section {
        padding: 70px 8%;
    }

    .section-title {
        text-align: center;
        margin-bottom: 40px;
        color: #006b28;
        font-size: 35px;
    }

    /* Sobre */
    .about {
        background-color: white;
    }

    .about-content {
        max-width: 900px;
        margin: auto;
        text-align: center;
        font-size: 18px;
    }

    /* Cards */
    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
    }

    .card {
        background-color: white;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .card .icon {
        font-size: 50px;
        margin-bottom: 15px;
    }

    .card h3 {
        color: #009c3b;
        margin-bottom: 10px;
    }

    /* Seleções */
    .teams {
        background-color: #eeeeee;
    }

    .team-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        max-width: 1000px;
        margin: auto;
    }

    .team {
        background: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
    }

    .team:hover {
        background-color: #009c3b;
        color: white;
    }

    /* Curiosidades */
    .facts {
        background-color: white;
    }

    .facts ul {
        max-width: 800px;
        margin: auto;
        list-style: none;
    }

    .facts li {
        background-color: #f4f4f4;
        margin-bottom: 15px;
        padding: 18px;
        border-left: 5px solid #ffdf00;
        border-radius: 5px;
    }

    /* Rodapé */
    footer {
        background-color: #003d1a;
        color: white;
        text-align: center;
        padding: 25px;
    }

    footer span {
        color: #ffdf00;
    }

    /* Responsividade */
    @media (max-width: 900px) {
        .cards {
            grid-template-columns: 1fr;
        }

        .team-list {
            grid-template-columns: repeat(2, 1fr);
        }

        .hero h2 {
            font-size: 40px;
        }
    }

    @media (max-width: 600px) {
        header {
            flex-direction: column;
            gap: 15px;
        }

        nav ul {
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        section {
            padding: 50px 5%;
        }

        .team-list {
            grid-template-columns: 1fr;
        }

        .hero {
            min-height: 450px;
        }

        .hero h2 {
            font-size: 32px;
        }

        .hero p {
            font-size: 17px;
        }
    }
</style>
